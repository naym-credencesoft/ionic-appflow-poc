<ion-content>
    <ion-card class="list-back text-white" style="    border: 1px solid gray;">
        <ion-card-header>
            <ion-card-title class="text-white">{{ this.title }}</ion-card-title>
            <ion-card-subtitle class="text-white" style="margin-top: 7px;"
                >{{ this.subTitleText }}
            </ion-card-subtitle>
            <!-- <div class="status">
                <ion-icon class="success-icon" *ngIf ="this.status ==='success'" name="checkmark-circle-outline"></ion-icon>
                <ion-icon class="error-icon" *ngIf ="this.status ==='warning'" name="alert-outline"></ion-icon>
                <ion-icon class="error-icon" *ngIf ="this.status ==='error'" name="alert-circle-outline"></ion-icon>
              </div> -->
        </ion-card-header>

        <ion-card-content style=" text-align: center; font-size: 20px;">
            {{ this.message }}
        </ion-card-content>

        <ion-row>
            <ion-col size="12">
                <ion-button
                    shape="round"
                    expand="full"
                    class="button-submit"
                    (click)="onSubmit()"
                    *ngIf="submitButtonText != undefined"
                    >{{ this.submitButtonText }}</ion-button
                >
            </ion-col>

            <ion-col size="12">
                <ion-button
                    shape="round"
                    expand="full"
                    class="button-submit"
                    (click)="onSubmit2()"
                    *ngIf="submitButtonText2 != undefined"
                    >{{ this.submitButtonText2 }}</ion-button
                >
            </ion-col>
            <ion-col size="12">
                <ion-button
                    shape="round"
                    expand="full"
                    class="button-submit"
                    (click)="onCancel()"
                    *ngIf="cancelButtonText != undefined"
                    >{{ this.cancelButtonText }}</ion-button
                >
            </ion-col>
        </ion-row>
    </ion-card>
</ion-content>
