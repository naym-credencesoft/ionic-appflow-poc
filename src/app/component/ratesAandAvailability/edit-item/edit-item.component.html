<ion-card class="bg-white card">
    
    <ion-grid no-padding >  
      
<!-- -->
                <ion-row center no-margin no-padding> 
                    <ion-col no-margin no-padding width-50 style="text-align: center" >
                            <ion-text color="primary" style="font-size: 18px;" >{{ this.room.name }}</ion-text>
                            
                    </ion-col>                   
                    
                </ion-row>
                <ion-row center no-margin no-padding> 
                        <ion-col no-margin no-padding width-50 style="text-align: center" >
                                <ion-text color="primary" style="font-size: 12px;" >{{ dateService.convertMillisecondsToDateFormat(this.rate.date) }}</ion-text>
                        </ion-col>                   
                </ion-row>
        
                <form [formGroup]="onEditRateForm">
                <ion-row>
                        <ion-col size="12" size-xl="12" size-sm="12" size-md="12" size-lg="12">

                            <ion-row>
                                    <ion-text color="primary" style="font-size: 10px;" >Price</ion-text>
                            </ion-row>
                        
                            <ion-card no-margin style="border-radius: 2px;">
                                <ion-col no-padding size="12" size-xl="12" size-sm="12" size-md="12" size-lg="12">
                                        <ion-input formControlName="price" [(ngModel)]="rate.price" value="{{ rate.price | currency: token.getProperty().localCurrency.toUpperCase():'symbol':'1.2-2' }}" class="input-field" min="0"  placeholder="0" type="number" ></ion-input>
                                </ion-col>
                            </ion-card>
                                
                        </ion-col>

                </ion-row>

                <ion-row>
                    <ion-col size="12" size-xl="12" size-sm="12" size-md="12" size-lg="12">

                        <ion-row>
                                <ion-text color="primary" style="font-size: 10px;" >Total</ion-text>
                        </ion-row>
                    
                        <ion-card no-margin style="border-radius: 2px;">
                            <ion-col no-padding size="12" size-xl="12" size-sm="12" size-md="12" size-lg="12">
                                    <ion-input disabled formControlName="total" [(ngModel)]="rate.totalNoRooms"  class="input-field" min="0"  placeholder="0" type="number" ></ion-input>
                            </ion-col>
                        </ion-card>
                            
                    </ion-col>

            </ion-row>

            <ion-row>
                <ion-col size="12" size-xl="12" size-sm="12" size-md="12" size-lg="12">

                    <ion-row>
                            <ion-text color="primary" style="font-size: 10px;" >Booked</ion-text>
                    </ion-row>
                
                    <ion-card no-margin style="border-radius: 2px;">
                        <ion-col no-padding size="12" size-xl="12" size-sm="12" size-md="12" size-lg="12">
                                <ion-input  formControlName="booked" 
                                [(ngModel)]="rate.noOfBooked" 
                                class="input-field" min="0" max = "{{rate.totalNoRooms}}" 
                                placeholder="0"
                                (input)="valuechange($event.target.value)" 
                                type="number" ></ion-input>
                        </ion-col>
                    </ion-card>
                        
                </ion-col>

            </ion-row>

            <ion-row>
                <ion-col size="12" size-xl="12" size-sm="12" size-md="12" size-lg="12">

                    <ion-row>
                            <ion-text color="primary" style="font-size: 10px;" >Hold</ion-text>
                    </ion-row>
                
                    <ion-card no-margin style="border-radius: 2px;">
                        <ion-col no-padding size="12" size-xl="12" size-sm="12" size-md="12" size-lg="12">
                                <ion-input formControlName="hold" [(ngModel)]="rate.noOfOnHold" class="input-field" min="0"  placeholder="0" type="number" ></ion-input>
                        </ion-col>
                    </ion-card>
                        
                </ion-col>

            </ion-row>
            <ion-row>
                <ion-col size="12" size-xl="12" size-sm="12" size-md="12" size-lg="12">

                    <ion-row>
                            <ion-text color="primary" style="font-size: 10px;" >Available</ion-text>
                    </ion-row>
                
                    <ion-card no-margin style="border-radius: 2px;">
                        <ion-col no-padding size="12" size-xl="12" size-sm="12" size-md="12" size-lg="12">
                                <ion-input formControlName="Available" 
                                [(ngModel)]="rate.noOfAvailable" 
                                class="input-field" min="0" 
                                (input)="valuechangeAvailable($event.target.value)" 
                                max = "{{rate.totalNoRooms}}"  
                                placeholder="0" type="number" ></ion-input>
                        </ion-col>
                    </ion-card>
                        
                </ion-col>

            </ion-row>

            <ion-row>
                <ion-col size="6" size-xl="6" size-sm="6" size-md="6" size-lg="6">

                    <ion-button size="small" round expand="block" color="primary"  [disabled]="!onEditRateForm.valid|| isRequested" (click)="submit()" >Update</ion-button>
                </ion-col>

                <ion-col size="6" size-xl="6" size-sm="6" size-md="6" size-lg="6">
                        <ion-button size="small" round expand="block" color="primary" (click)="close()">Cancel</ion-button>
                </ion-col>
        </ion-row>
    
        </form>
             
            <!--  -->
        </ion-grid>

</ion-card>
