<ion-header>
    <ion-toolbar class="animated fadeIn shadeCol">
        <ion-buttons slot="start">
            <ion-back-button
                mode="md"
                icon="arrow-back"
                style="color: #fff"
            ></ion-back-button>
        </ion-buttons>
        <ion-text color="light" class="HeaderTitle">Update Inventory</ion-text>
    </ion-toolbar>
</ion-header>

<ion-content>
    <ion-card>
        <ion-grid no-padding>
            <form [formGroup]="onUpdateInventoryForm">
                <ion-row
                    style="
                        height: 100%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    "
                    *ngIf="!isInventoryCreated"
                >
                    <h4 style="color: red">Inventory not created yet</h4>
                </ion-row>

                <ion-row>
                    <ion-col size="6">
                        <ion-text
                            color="primary"
                            class="check-in-out-text"
                            style="font-size: 12px"
                        >
                            From Date*</ion-text
                        >
                        <ion-col size="12">
                            <ion-item lines="none" class="datetime-box">
                                <ion-datetime-button
                                    datetime="fromDate"
                                    class="date-btn"
                                ></ion-datetime-button>

                                <ion-icon
                                    name="calendar-clear"
                                    (click)="setFromDateOpen(true)"
                                    class="calendar-icon"
                                ></ion-icon>
                                <ion-modal
                                    [keepContentsMounted]="true"
                                    [isOpen]="isFromModalOpen"
                                    (ionModalDidDismiss)="dismissFromDateModal()"
                                >
                                    <ng-template>
                                        <ion-datetime
                                            id="fromDate"
                                            formControlName="rateAndAvailFromDate"
                                            [(ngModel)]="rateBundle.fromDate"
                                            style="color: #000"
                                            displayFormat="DD/MM/YYYY"
                                            placeholder="DD/MM/YYYY"
                                            presentation="date"
                                            [showDefaultButtons]="true"
                                            doneText="Done"
                                            cancelText="Cancel"
                                            style="color: #000"
                                            (ionChange)="fromDateChange($event)"
                                        >
                                        </ion-datetime>
                                    </ng-template>
                                </ion-modal>
                            </ion-item>
                        </ion-col>
                    </ion-col>

                    <ion-col size="6">
                        <ion-text
                            color="primary"
                            class="check-in-out-text"
                            style="font-size: 12px"
                        >
                            To Date*</ion-text
                        >
                        <ion-col size="12">
                            <ion-item
                                lines="none"
                                [disabled]="!rateBundle.fromDate"
                                class="datetime-box"
                            >
                                <!-- <ion-icon name="calendar" slot="start" style="color:#F89A34; margin-right: 6px;"></ion-icon> -->
                                <ion-datetime-button
                                    datetime="toDate"
                                    class="date-btn"
                                ></ion-datetime-button>

                                <ion-icon
                                    name="calendar-clear"
                                    (click)="setToDateOpen(true)"
                                    class="calendar-icon"
                                ></ion-icon>
                                <ion-modal
                                    [isOpen]="isToModalOpen"
                                    (ionModalDidDismiss)="dismissToDateModal()"
                                    [keepContentsMounted]="true"
                                >
                                    <ng-template>
                                        <ion-datetime
                                            id="toDate"
                                            presentation="date"
                                            formControlName="rateAndAvailToDate"
                                            [(ngModel)]="rateBundle.toDate"
                                            [min]="rateBundle.fromDate"
                                            style="color: #000"
                                            displayFormat="DD/MM/YYYY"
                                            placeholder="DD/MM/YYYY"
                                            [showDefaultButtons]="true"
                                            doneText="Done"
                                            cancelText="Cancel"
                                            (ionChange)="toDateChange($event)"
                                        >
                                        </ion-datetime>
                                    </ng-template>
                                </ion-modal>
                            </ion-item>
                        </ion-col>
                    </ion-col>
                </ion-row>

                <ion-row>
                    <ion-col size="6">
                        <ion-text
                            class="title-text"
                            color="primary"
                            style="font-size: 12px"
                            >No Of Rooms*</ion-text
                        >
                        <ion-input
                            formControlName="noOfRooms"
                            [(ngModel)]="rateBundle.totalNoRooms"
                            placeholder="0"
                            inputmode="number"
                            type="number"
                            min="0"
                            class="input-background"
                        ></ion-input>
                    </ion-col>

                    <ion-col size="6">
                        <ion-text
                            class="title-text"
                            color="primary"
                            style="font-size: 12px"
                            >Price*</ion-text
                        >
                        <ion-input
                            formControlName="price"
                            [(ngModel)]="rateBundle.price"
                            placeholder="0"
                            inputmode="number"
                            type="number"
                            class="input-background"
                        ></ion-input>
                    </ion-col>
                </ion-row>

                <ion-row>
                    <ion-col size="4">
                        <ion-text
                            class="title-text"
                            color="primary"
                            style="font-size: 12px"
                            >Booked*</ion-text
                        >

                        <ion-input
                            formControlName="Booked"
                            [(ngModel)]="rateBundle.noOfBooked"
                            placeholder="0"
                            inputmode="number"
                            type="number"
                            min="0"
                            class="input-background"
                        ></ion-input>
                    </ion-col>

                    <ion-col size="4">
                        <ion-text
                            class="title-text"
                            color="primary"
                            style="font-size: 12px"
                            >Available*</ion-text
                        >

                        <ion-input
                            formControlName="Available"
                            [(ngModel)]="rateBundle.noOfAvailable"
                            placeholder="0"
                            inputmode="number"
                            type="number"
                            class="input-background"
                        ></ion-input>
                    </ion-col>

                    <ion-col size="4">
                        <ion-text
                            class="title-text"
                            color="primary"
                            style="font-size: 12px"
                            >Hold</ion-text
                        >

                        <ion-input
                            formControlName="Hold"
                            [(ngModel)]="rateBundle.noOfOnHold"
                            placeholder="0"
                            inputmode="number"
                            type="number"
                            class="input-background"
                        ></ion-input>
                    </ion-col>
                </ion-row>

                <ion-row>
                    <ion-col size="6">
                        <ion-button
                            expand="block"
                            color="primary"
                            (click)="submit()"
                            [disabled]="!onUpdateInventoryForm.valid|| loader || !isInventoryCreated"
                        >
                            Create</ion-button
                        >
                    </ion-col>

                    <ion-col size="6">
                        <ion-button
                            expand="block"
                            class="btn-cancel"
                            (click)="cancel()"
                            >Cancel</ion-button
                        >
                    </ion-col>
                </ion-row>
            </form>
        </ion-grid>
    </ion-card>
</ion-content>
