          </ion-col>
    
        </ion-row>

                <div style="
                margin: 1rem auto;
                padding: 1rem;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                background-color: #f9f9f9;
                width: 90%;
                box-sizing: border-box;
                border:1px solid gray;
            ">
            <ion-text 
                style="display: block;font-size: 1.5rem; font-weight: bold; color: #333; margin-bottom: 1rem;">
                Room Details
            </ion-text>
            <table style="
                width: 100%;
                border-collapse: collapse;
                text-align: left;
                font-size: 1rem;
                color: #555;
            ">
                <tbody>
                    <tr>
                        <td style="padding: 0.5rem; font-weight: 600;">Room Type</td>
                        <td style="padding: 0.5rem; color: #333;">{{ this.room.name }}</td>
                    </tr>
                    <tr style="background-color: #f4f4f4;">
                        <td style="padding: 0.5rem; font-weight: 600;">No of Rooms</td>
                        <td style="padding: 0.5rem; color: #333;">{{ room.noOfRooms }}</td>
                    </tr>
                    <tr>
                        <td style="padding: 0.5rem; font-weight: 600;">Minimum Stay</td>
                        <td style="padding: 0.5rem; color: #333;">{{ room.minimumLengthOfStay }}</td>
                    </tr>
                    <tr style="background-color: #f4f4f4;">
                        <td style="padding: 0.5rem; font-weight: 600;">Maximum Stay</td>
                        <td style="padding: 0.5rem; color: #333;">{{ room.maximumLengthOfStay }}</td>
                    </tr>
                    <tr>
                        <td style="padding: 0.5rem; font-weight: 600;">Room Price</td>
                        <td style="padding: 0.5rem; color: #333;">{{ room.roomOnlyPrice }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
